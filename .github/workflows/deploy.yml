name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # Runs at 08:00 and 20:00 Asia/Shanghai.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [obsidian-updated]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check automation secrets
        id: automation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "$R2_ACCESS_KEY_ID" ] && missing+=("R2_ACCESS_KEY_ID")
          [ -z "$R2_SECRET_ACCESS_KEY" ] && missing+=("R2_SECRET_ACCESS_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Automatic deployment is not active yet. Missing GitHub secrets: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.automation.outputs.ready == 'true'
        run: npm ci

      - name: Build from R2-backed Obsidian notes
        if: steps.automation.outputs.ready == 'true'
        run: npm run build
        env:
          OBSIDIAN_SOURCE: r2
          OBSIDIAN_R2_REQUIRED: true
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OBSIDIAN_R2_BUCKET: ${{ vars.OBSIDIAN_R2_BUCKET }}
          OBSIDIAN_R2_NOTES_PREFIX: ${{ vars.OBSIDIAN_R2_NOTES_PREFIX }}
          OBSIDIAN_R2_PAPERS_PREFIX: ${{ vars.OBSIDIAN_R2_PAPERS_PREFIX }}

      - name: Deploy to Cloudflare Pages
        if: steps.automation.outputs.ready == 'true'
        run: npx wrangler@latest pages deploy dist --project-name dreamkeeperhu-github-io --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
